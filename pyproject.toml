[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinderfold"
version = "0.2.0"
description = "Schema drift detection for tabular data pipelines."
requires-python = ">=3.10"
authors = [{name = "Andre Ahlert", email = "andre@aex.partners"}]
license = {text = "Apache-2.0"}
readme = "README.md"
keywords = ["schema", "drift", "migration", "sql", "database", "diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/aexpartners/cinderfold"
Issues = "https://github.com/aexpartners/cinderfold/issues"

[project.scripts]
cinderfold = "cinderfold.cli:main"

[tool.setuptools.packages.find]
include = ["cinderfold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
